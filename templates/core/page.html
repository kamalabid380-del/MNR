{% extends "core/base.html" %}

{% block title %}{{ page.title }} — {{ site.brand_name }}{% endblock %}

{% block content %}
<section class="max-w-3xl mx-auto px-4 sm:px-6 py-12 sm:py-16">
  <p class="text-[10px] tracking-[0.3em] uppercase text-gold text-center">{{ site.short_name }} Design Studio</p>
  <h1 class="mt-1 text-2xl sm:text-3xl font-light tracking-[0.15em] uppercase text-center mb-10">{{ page.title }}</h1>
  <div class="page-body text-sm text-gray-600 leading-relaxed">{{ page.body|safe }}</div>
</section>
{% endblock %}
