<a href="{% url 'product' p.slug %}" class="block group">
  <div class="zoom-box relative aspect-[3/4] bg-cream">
    {% if p.image %}
    <img src="{{ p.image.url }}" alt="{{ p.name }}" loading="lazy" class="w-full h-full object-cover">
    {% endif %}
    {% if p.on_sale %}
    <span class="absolute top-3 left-3 bg-sale text-white px-2 py-1 text-[9px] tracking-[0.2em] uppercase">Sale</span>
    {% endif %}
    {% if not p.available %}
    <span class="absolute top-3 right-3 bg-ink/80 text-white px-2 py-1 text-[9px] tracking-[0.2em] uppercase">Sold Out</span>
    {% endif %}
  </div>
  <h3 class="mt-3 text-[11px] sm:text-xs tracking-[0.12em] uppercase text-ink leading-snug group-hover:text-mauve transition-colors">{{ p.name }}</h3>
  <p class="mt-1 text-xs text-gray-600">
    {% if p.on_sale %}<span class="line-through text-gray-400 mr-2">Rs. {{ p.compare_price|floatformat:"0" }}</span><span class="text-sale">Rs. {{ p.price|floatformat:"0" }}</span>
    {% else %}Rs. {{ p.price|floatformat:"0" }}{% endif %}
  </p>
</a>
